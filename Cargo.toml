[workspace]
resolver = "3"
members = [
    "crates/audioeval-cli",
    "crates/audio-io",
    "crates/benchmarks",
    "crates/2f",
    "crates/visqol",
    "crates/visqol-compare",
    "crates/visqol-cpp",
    "crates/zimtohrli",
    "crates/zimtohrli-compare",
    "crates/zimtohrli-cpp",
]

[workspace.dependencies]
audio-io = { path = "crates/audio-io" }
audioeval-2f = { path = "crates/2f" }
audioeval-visqol = { path = "crates/visqol" }
visqol-cpp = { path = "crates/visqol-cpp" }
audioeval-zimtohrli = { path = "crates/zimtohrli" }
zimtohrli-cpp = { path = "crates/zimtohrli-cpp" }

anyhow = "1.0.103"
clap = "4.6.1"
criterion = "0.8.2"
symphonia = "0.6"
rubato = "5.0.0"
audioadapter = "5.0.0"
audioadapter-buffers = "5.0.0"
libm = "0.2.16"
num-complex = "0.4"
realfft = "3.5"
fearless_simd = "0.7.0"

[workspace.lints]
clippy.excessive_precision = "allow"

[profile.release]
debug = "full"

# The metric conformance tests process substantial amounts of audio; keep the
# DSP optimized even in dev/test builds.
[profile.dev.package.audioeval-visqol]
opt-level = 2
[profile.dev.package.audioeval-2f]
opt-level = 2
[profile.dev.package.audioeval-zimtohrli]
opt-level = 2
[profile.dev.package.realfft]
opt-level = 2
[profile.dev.package.rustfft]
opt-level = 2