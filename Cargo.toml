[workspace]
resolver = "2"
members = [
    "crates/audio-io",
    "crates/benchmarks",
    "crates/visqol",
    "crates/visqol-compare",
    "crates/visqol-cpp",
    "crates/zimtohrli",
    "crates/zimtohrli-compare",
    "crates/zimtohrli-cpp",
]

[workspace.dependencies]
audio-io = { path = "crates/audio-io" }
visqol = { path = "crates/visqol" }
visqol-cpp = { path = "crates/visqol-cpp" }
zimtohrli = { path = "crates/zimtohrli" }
zimtohrli-cpp = { path = "crates/zimtohrli-cpp" }

anyhow = "1.0.103"
clap = "4.6.1"
symphonia = "0.6"
rubato = "3.0.0"
audioadapter = "3.0.0"
audioadapter-buffers = "3.0.0"
libm = "0.2.16"
num-complex = "0.4"
realfft = "3.5"
fearless_simd = "0.6.0"

[profile.release]
debug = "full"

# The visqol conformance tests process tens of seconds of audio; keep the DSP
# optimized even in dev/test builds.
[profile.dev.package.visqol]
opt-level = 2
[profile.dev.package.realfft]
opt-level = 2
[profile.dev.package.rustfft]
opt-level = 2

[workspace.lints]
clippy.excessive_precision = "allow"