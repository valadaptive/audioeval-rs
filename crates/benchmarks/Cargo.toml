[package]
name = "benchmarks"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Head-to-head benchmarks of the Rust metric implementations against the C++ originals"
publish = false

[dev-dependencies]
audio-io.workspace = true
criterion = "0.8.2"
visqol.workspace = true
visqol-cpp.workspace = true
zimtohrli.workspace = true
zimtohrli-cpp.workspace = true

# Bench-only crate: keep libtest out of the way so that criterion CLI flags
# can be passed with a plain `cargo bench -p benchmarks -- <flags>`.
[lib]
test = false
bench = false

[[bench]]
name = "visqol"
harness = false

[[bench]]
name = "zimtohrli"
harness = false

[lints]
workspace = true
